<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港健康文化協會 - 考核表格</title>
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIuimmemAheaDheaxieS9k+iCsiAtIOiDveagoOezu3XpIiwKICAic2hvcnRfbmFtZSI6ICLllqRleGFtIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiM0QTE2OEIiLAogICJ0aGVtZV9jb2xvciI6ICIjNEExNjhCIgp9">
  
  <style>
    :root { --primary-purple: #4A168B; --light-purple: #7B2CBF; --bg-purple: #F3E8FF; }
    body { font-family: sans-serif; background-color: var(--bg-purple); padding: 15px; margin: 0; }
    .container { max-width: 800px; margin: 0 auto; }
    .header { background: var(--primary-purple); color: white; padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 20px; }
    .card { background: white; padding: 20px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    input, select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #CCC; border-radius: 8px; box-sizing: border-box; }
    label { font-size: 13px; font-weight: bold; display: block; margin-top: 5px; }
    button { background-color: var(--light-purple); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 10px; font-weight: bold; }
    .btn-export { background-color: #007BFF; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #EEE; padding: 10px; text-align: center; font-size: 14px; }
    th { background-color: var(--primary-purple); color: white; }
    #loginOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-purple); z-index:1000; display:flex; flex-direction:column; justify-content:center; align-items:center; }
  </style>
</head>
<body>

<!-- 登入畫面 -->
<div id="loginOverlay">
  <div class="card" style="width: 80%; max-width: 300px;">
    <h2>請選擇登入身份</h2>
    <input type="password" id="pwInput" placeholder="請輸入密碼">
    <button onclick="login('tutor')" style="background-color: var(--primary-purple);">導師登入</button>
    <button onclick="login('student')">學員登入 (唯讀)</button>
  </div>
</div>

<div class="container" id="mainContent" style="display:none;">
  <div class="header"><h1>香港健康文化協會<br>考核表格</h1></div>
  <div class="card">
    <h2>進行考核</h2>
    <select id="studentSelect" onchange="loadStudentData()"><option value="">-- 選擇學員 --</option></select>
    <div class="grid-2">
      <div><label>學號：</label><input type="text" id="examId" readonly></div>
      <div><label>現時級別：</label><input type="text" id="examRank" readonly></div>
    </div>
    <h3 style="font-size:16px; color:#4A168B;">一、功法考核</h3>
    <div class="grid-2">
      <div><label>前俯腰 (吋)：</label><input type="text" id="input1"></div>
      <div><label>指/拳/掌：</label><input type="text" id="input2"></div>
      <div><label>定式 (分/秒)：</label><input type="text" id="input3"></div>
      <div><label>膝/腰/臂膊：</label><input type="text" id="input4"></div>
      <div><label>外擺腿：</label><input type="text" id="input5"></div>
      <div><label>腿法：</label><input type="text" id="input6"></div>
    </div>
    <label>考核是否合格：</label>
    <select id="examPassed">
      <option value="否">否 (保持原級別)</option>
      <option value="是_升級">是 (晉升下一級)</option>
      <option value="是_保持">是 (已通過，但保持原級別)</option>
    </select>
    <button id="saveBtn" onclick="saveExamResult()" style="background-color: var(--primary-purple);">儲存考核紀錄</button>
  </div>

  <div class="card" id="adminSection">
    <h2>學員管理</h2>
    <input type="text" id="newStudentId" placeholder="學號">
    <input type="text" id="newStudentName" placeholder="姓名">
    <button onclick="addStudent()">新增學員</button>
    <button class="btn-export" onclick="exportReport()">下載考核報告 (CSV)</button>
  </div>

  <div class="card">
    <h2>學員名冊</h2>
    <table>
      <thead><tr><th>學號</th><th>姓名</th><th>級別</th><th class="adminOnly">操作</th></tr></thead>
      <tbody id="studentTableBody"></tbody>
    </table>
  </div>
</div>

<script>
  let currentUserRole = '';
  const RANKS = ["10級", "九級", "八級", "七級", "六級", "伍級", "四級", "三級", "二級", "一級", "黑帶"];
  let students = JSON.parse(localStorage.getItem('hk_health_students')) || [
    { id: "6", name: "盧明俐", rank: "黑帶" }, { id: "15", name: "林雪蓮", rank: "黑帶" },
    { id: "20", name: "譚美霞", rank: "黑帶" }, { id: "17", name: "李翹伶", rank: "黑帶" },
    { id: "9", name: "陸婥然", rank: "黑帶" }, { id: "16", name: "何肇東", rank: "黑帶" },
    { id: "8", name: "陳麗君", rank: "黑帶" }, { id: "5", name: "張勵常", rank: "10級" },
    { id: "23", name: "陸景城", rank: "九級" }, { id: "24", name: "黎世瓊", rank: "九級" },
    { id: "26", name: "楊燕娜", rank: "九級" }, { id: "25", name: "區美珍", rank: "九級" },
    { id: "32", name: "黄愛晴", rank: "六級" }, { id: "44", name: "方兆賢", rank: "六級" },
    { id: "29", name: "梁美玲", rank: "六級" }, { id: "31", name: "蔡麗珠", rank: "六級" },
    { id: "38", name: "關凱惠", rank: "六級" }, { id: "37", name: "鄺炳權", rank: "伍級" },
    { id: "35", name: "李文英", rank: "伍級" }, { id: "36", name: "鍾炳權", rank: "伍級" },
    { id: "39", name: "蘇少賢", rank: "伍級" }, { id: "45", name: "張家莉", rank: "四級" },
    { id: "46", name: "周响輝", rank: "四級" }, { id: "42", name: "鍾麗君", rank: "四級" },
    { id: "40", name: "歐志雄", rank: "四級" }, { id: "39", name: "蘇少敏", rank: "二級" },
    { id: "47", name: "朱秉江", rank: "一級" }, { id: "48", name: "廖金虹", rank: "一級" }
  ];

  function login(role) {
    const pw = document.getElementById('pwInput').value;
    if (role === 'tutor' && pw === 'exam') { currentUserRole = 'tutor'; }
    else if (role === 'student' && pw === 'view') { currentUserRole = 'student'; }
    else { alert('密碼錯誤！'); return; }
    
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    if (currentUserRole === 'student') {
      document.getElementById('adminSection').style.display = 'none';
      document.getElementById('saveBtn').style.display = 'none';
      const adminOnly = document.querySelectorAll('.adminOnly');
      adminOnly.forEach(el => el.style.display = 'none');
    }
    renderStudents();
  }

  function renderStudents() {
    const tbody = document.getElementById('studentTableBody');
    const select = document.getElementById('studentSelect');
    tbody.innerHTML = '';
    select.innerHTML = '<option value="">-- 選擇學員 --</option>';
    students.forEach((s, index) => {
      let row = `<tr><td>${s.id}</td><td>${s.name}</td><td>${s.rank}</td>`;
      if (currentUserRole === 'tutor') row += `<td><button style="background:red; padding:5px; width:40px;" onclick="deleteStudent(${index})">X</button></td>`;
      row += `</tr>`;
      tbody.innerHTML += row;
      select.innerHTML += `<option value="${index}">${s.id} - ${s.name}</option>`;
    });
  }

  function saveAndRender() { localStorage.setItem('hk_health_students', JSON.stringify(students)); renderStudents(); }
  function addStudent() {
    const name = document.getElementById('newStudentName').value;
    if(!name) return alert('請填寫姓名');
    students.push({ id: document.getElementById('newStudentId').value || "-", name: name, rank: "一級" });
    saveAndRender();
  }
  function deleteStudent(index) { if(confirm('確定刪除？')) { students.splice(index, 1); saveAndRender(); } }
  function loadStudentData() {
    const idx = document.getElementById('studentSelect').value;
    if (idx !== "") { document.getElementById('examId').value = students[idx].id; document.getElementById('examRank').value = students[idx].rank; }
  }
  function saveExamResult() {
    const idx = document.getElementById('studentSelect').value;
    const action = document.getElementById('examPassed').value;
    if (idx === "") return alert('請選擇學員');
    if (action === '是_升級') {
      let rIdx = RANKS.indexOf(students[idx].rank);
      if (rIdx < RANKS.length - 1) students[idx].rank = RANKS[rIdx + 1];
      alert('考核合格！已晉升。');
    } else { alert('考核結果已記錄。'); }
    saveAndRender();
  }
  function exportReport() {
    let csvContent = "\uFEFF學號,姓名,級別\n";
    students.forEach(s => csvContent += `${s.id},${s.name},${s.rank}\n`);
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "考核報告.csv";
    link.click();
  }
</script>
</body>
</html>
