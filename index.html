<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港健康文化協會 - 考核表格</title>
  <style>
    :root { --primary-purple: #4A168B; --light-purple: #7B2CBF; --bg-purple: #F3E8FF; }
    body { font-family: sans-serif; background-color: var(--bg-purple); padding: 15px; margin: 0; }
    .container { max-width: 850px; margin: 0 auto; }
    .header { background: var(--primary-purple); color: white; padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 20px; }
    .card { background: white; padding: 20px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    input, select { width: 100%; padding: 8px; margin: 4px 0; border: 1px solid #CCC; border-radius: 6px; box-sizing: border-box; }
    label { font-size: 13px; font-weight: bold; color: #333; }
    button { background-color: var(--light-purple); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 10px; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #EEE; padding: 8px; text-align: center; font-size: 13px; }
    th { background-color: var(--primary-purple); color: white; }
    #loginOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-purple); z-index:1000; display:flex; flex-direction:column; justify-content:center; align-items:center; }
    .section-title { color: var(--primary-purple); border-bottom: 2px solid var(--bg-purple); padding-bottom: 5px; margin-top: 15px; }
  </style>
</head>
<body>

<div id="loginOverlay">
  <div class="card" style="width: 80%; max-width: 300px; text-align: center;">
    <h2>身份登入</h2>
    <input type="password" id="pwInput" placeholder="請輸入密碼">
    <button onclick="login('tutor')" style="background-color: var(--primary-purple);">導師登入</button>
    <button onclick="login('student')" style="background-color: #28a745;">學員登入</button>
  </div>
</div>

<div class="container" id="mainContent" style="display:none;">
  <div class="header"><h1>香港健康文化協會<br>考核表格</h1></div>
  
  <div class="card">
    <h2>進行考核</h2>
    <select id="studentSelect" onchange="loadStudentData()"><option value="">-- 請選擇學員 --</option></select>
    
    <div class="grid-3" style="margin-top:10px;">
      <div><label>學號：</label><input type="text" id="examId" readonly></div>
      <div><label>現時級別：</label><input type="text" id="examRank" readonly></div>
    </div>

    <!-- 一、功法考核 -->
    <h3 class="section-title">一、功法考核</h3>
    <div class="grid-3">
      <div><label>前俯腰 (吋)：</label><input type="text" id="s_腰吋" class="score-input"></div>
      <div><label>指：</label><input type="text" id="s_指" class="score-input"></div>
      <div><label>拳：</label><input type="text" id="s_拳" class="score-input"></div>
      <div><label>掌：</label><input type="text" id="s_掌" class="score-input"></div>
      <div><label>定式 (分/秒)：</label><input type="text" id="s_定式" class="score-input"></div>
      <div><label>膝：</label><input type="text" id="s_膝" class="score-input"></div>
      <div><label>腰：</label><input type="text" id="s_腰" class="score-input"></div>
      <div><label>外擺腿：</label><input type="text" id="s_外擺腿" class="score-input"></div>
      <div><label>臂膊：</label><input type="text" id="s_臂膊" class="score-input"></div>
      <div><label>腿法 - 彈腿：</label><input type="text" id="s_彈腿" class="score-input"></div>
      <div><label>腿法 - 蹬腿：</label><input type="text" id="s_蹬腿" class="score-input"></div>
      <div><label>腿法 - 側踢：</label><input type="text" id="s_側踢" class="score-input"></div>
    </div>

    <!-- 二、拳腳考核 -->
    <h3 class="section-title">二、拳腳考核</h3>
    <div class="grid-3">
      <div><label>雙拳三步：</label><input type="text" id="s_雙拳三步" class="score-input"></div>
      <div><label>七式 - 活步：</label><input type="text" id="s_七式活步" class="score-input"></div>
      <div><label>七式 - A前進攻：</label><input type="text" id="s_七式進攻" class="score-input"></div>
      <div><label>七式 - B後退防：</label><input type="text" id="s_七式退防" class="score-input"></div>
      <div><label>原地十式：</label><input type="text" id="s_原地十式" class="score-input"></div>
      <div><label>活步十式：</label><input type="text" id="s_活步十式" class="score-input"></div>
      <div><label>本級：</label><input type="text" id="s_本級" class="score-input"></div>
    </div>

    <div style="margin-top:15px;">
      <label>考核結果：</label>
      <select id="examPassed">
        <option value="保持原級別">否 (保持原級別)</option>
        <option value="合格-晉升">是 (晉升下一級)</option>
        <option value="合格-保持">是 (合格，但保持原級別)</option>
      </select>
    </div>

    <button id="saveBtn" onclick="saveExamResult()" style="background-color: var(--primary-purple);">儲存考核紀錄</button>
  </div>

  <div class="card" id="adminSection">
    <h2>管理功能</h2>
    <input type="text" id="newStudentId" placeholder="學號">
    <input type="text" id="newStudentName" placeholder="姓名">
    <button onclick="addStudent()">新增學員</button>
    <button style="background-color:#007BFF;" onclick="exportReport()">下載完整考核 CSV 報告</button>
  </div>

  <div class="card">
    <h2>學員名冊</h2>
    <table>
      <thead><tr><th>學號</th><th>姓名</th><th>級別</th><th class="adminOnly">操作</th></tr></thead>
      <tbody id="studentTableBody"></tbody>
    </table>
  </div>
</div>

<script>
  let currentUserRole = '';
  const RANKS = ["10級", "九級", "八級", "七級", "六級", "伍級", "四級", "三級", "二級", "一級", "黑帶"];
  const SCORE_KEYS = ["腰吋","指","拳","掌","定式","膝","腰","外擺腿","臂膊","彈腿","蹬腿","側踢","雙拳三步","七式活步","七式進攻","七式退防","原地十式","活步十式","本級"];

  let defaultStudents = [
    { id: "6", name: "盧明俐", rank: "黑帶" }, { id: "15", name: "林雪蓮", rank: "黑帶" },
    { id: "20", name: "譚美霞", rank: "黑帶" }, { id: "17", name: "李翹伶", rank: "黑帶" },
    { id: "9", name: "陸婥然", rank: "黑帶" }, { id: "16", name: "何肇東", rank: "黑帶" },
    { id: "8", name: "陳麗君", rank: "黑帶" }, { id: "5", name: "張勵常", rank: "10級" },
    { id: "23", name: "陸景城", rank: "九級" }, { id: "24", name: "黎世瓊", rank: "九級" },
    { id: "26", name: "楊燕娜", rank: "九級" }, { id: "25", name: "區美珍", rank: "九級" },
    { id: "32", name: "黃愛晴", rank: "六級" }, { id: "44", name: "方兆賢", rank: "六級" },
    { id: "29", name: "梁美玲", rank: "六級" }, { id: "31", name: "蔡麗珠", rank: "六級" },
    { id: "38", name: "關凱惠", rank: "六級" }, { id: "37", name: "鄺炳權", rank: "伍級" },
    { id: "35", name: "李文英", rank: "伍級" }, { id: "36", name: "鍾炳權", rank: "伍級" },
    { id: "39", name: "蘇少賢", rank: "伍級" }, { id: "45", name: "張家莉", rank: "四級" },
    { id: "46", name: "周响輝", rank: "四級" }, { id: "42", name: "鍾麗君", rank: "四級" },
    { id: "40", name: "歐志雄", rank: "四級" }, { id: "39", name: "蘇少敏", rank: "二級" },
    { id: "47", name: "朱秉江", rank: "一級" }, { id: "48", name: "廖金虹", rank: "一級" }
  ];

  let students = JSON.parse(localStorage.getItem('hk_health_students')) || defaultStudents;

  function login(role) {
    if (role === 'tutor') {
      const pw = document.getElementById('pwInput').value;
      if (pw !== 'exam') { alert('密碼錯誤！'); return; }
      currentUserRole = 'tutor';
    } else {
      currentUserRole = 'student';
    }
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    if (currentUserRole === 'student') {
      document.getElementById('adminSection').style.display = 'none';
      document.getElementById('saveBtn').style.display = 'none';
      document.querySelectorAll('.adminOnly').forEach(el => el.style.display = 'none');
    }
    renderStudents();
  }

  function renderStudents() {
    const tbody = document.getElementById('studentTableBody');
    const select = document.getElementById('studentSelect');
    tbody.innerHTML = '';
    select.innerHTML = '<option value="">-- 請選擇學員 --</option>';
    students.forEach((s, index) => {
      let row = `<tr><td>${s.id}</td><td>${s.name}</td><td>${s.rank}</td>`;
      if (currentUserRole === 'tutor') row += `<td><button style="background:red; padding:4px; width:35px;" onclick="deleteStudent(${index})">X</button></td>`;
      row += `</tr>`;
      tbody.innerHTML += row;
      select.innerHTML += `<option value="${index}">${s.id} - ${s.name}</option>`;
    });
  }

  function saveAndRender() { localStorage.setItem('hk_health_students', JSON.stringify(students)); renderStudents(); }

  function addStudent() {
    const name = document.getElementById('newStudentName').value;
    if(!name) return alert('請填寫姓名');
    let id = document.getElementById('newStudentId').value || "待補";
    students.push({ id: id, name: name, rank: "一級", scores: {}, result: "" });
    saveAndRender();
    document.getElementById('newStudentName').value = '';
    document.getElementById('newStudentId').value = '';
    alert('學員新增成功');
  }

  function deleteStudent(index) { if(confirm('確定刪除？')) { students.splice(index, 1); saveAndRender(); } }

  function loadStudentData() {
    const idx = document.getElementById('studentSelect').value;
    if (idx !== "") {
      const s = students[idx];
      document.getElementById('examId').value = s.id;
      document.getElementById('examRank').value = s.rank;
      
      // 讀取先前填過的分數
      if (s.scores) {
        SCORE_KEYS.forEach(k => {
          document.getElementById('s_' + k).value = s.scores[k] || '';
        });
      } else {
        document.querySelectorAll('.score-input').forEach(i => i.value = '');
      }
      if (s.result) document.getElementById('examPassed').value = s.result;
    }
  }

  function saveExamResult() {
    const idx = document.getElementById('studentSelect').value;
    const action = document.getElementById('examPassed').value;
    if (idx === "") return alert('請選擇學員');
    
    // 儲存該學員的各項成績
    let scoresObj = {};
    SCORE_KEYS.forEach(k => {
      scoresObj[k] = document.getElementById('s_' + k).value;
    });
    students[idx].scores = scoresObj;
    students[idx].result = action;

    // 晉升邏輯
    if (action === '合格-晉升') {
      let rIdx = RANKS.indexOf(students[idx].rank);
      if (rIdx < RANKS.length - 1) students[idx].rank = RANKS[rIdx + 1];
      alert('考核紀錄已儲存！學員已順利晉升。');
    } else {
      alert('考核紀錄已儲存。');
    }

    // 清空分數輸入框，方便進行下一位
    document.querySelectorAll('.score-input').forEach(input => input.value = '');
    document.getElementById('examPassed').selectedIndex = 0;
    saveAndRender();
  }

  function exportReport() {
    // CSV 標頭包含所有考核分數欄位
    let csvHeader = ["學號", "姓名", "現時級別", "前俯腰(吋)", "指", "拳", "掌", "定式(分/秒)", "膝", "腰", "外擺腿", "臂膊", "彈腿", "蹬腿", "側踢", "雙拳三步", "七式-活步", "七式-進攻", "七式-退防", "原地十式", "活步十式", "本級", "考核結果"];
    let csvContent = "\uFEFF" + csvHeader.join(",") + "\n";

    students.forEach(s => {
      let sc = s.scores || {};
      let row = [
        s.id,
        s.name,
        s.rank,
        sc["腰吋"] || "",
        sc["指"] || "",
        sc["拳"] || "",
        sc["掌"] || "",
        sc["定式"] || "",
        sc["膝"] || "",
        sc["腰"] || "",
        sc["外擺腿"] || "",
        sc["臂膊"] || "",
        sc["彈腿"] || "",
        sc["蹬腿"] || "",
        sc["側踢"] || "",
        sc["雙拳三步"] || "",
        sc["七式活步"] || "",
        sc["七式進攻"] || "",
        sc["七式退防"] || "",
        sc["原地十式"] || "",
        sc["活步十式"] || "",
        sc["本級"] || "",
        s.result || ""
      ];
      csvContent += row.join(",") + "\n";
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `武術考核報告_${new Date().toLocaleDateString()}.csv`;
    link.click();
  }
</script>
</body>
</html>
