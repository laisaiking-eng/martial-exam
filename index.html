<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港健康文化協會 - 考核表格</title>
  
  <!-- PWA 設定 -->
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIuimmemAheaDheaxieS9k+iCsiAtIOiDveagoOezu3XpIiwKICAic2hvcnRfbmFtZSI6ICLotK3nvrflhIciLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiIzRBMTY4QiIsCiAgInRoZW1lX2NvbG9yIjogIiM0QTE2OEIiCn0=">
  
  <style>
    :root { --primary-purple: #4A168B; --light-purple: #7B2CBF; --bg-purple: #F3E8FF; }
    body { font-family: sans-serif; background-color: var(--bg-purple); padding: 15px; margin: 0; }
    .container { max-width: 800px; margin: 0 auto; }
    .header { background: var(--primary-purple); color: white; padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 20px; }
    .card { background: white; padding: 20px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    input, select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #CCC; border-radius: 8px; box-sizing: border-box; }
    button { background-color: var(--light-purple); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 10px; font-weight: bold; }
    .btn-export { background-color: #28a745; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #EEE; padding: 10px; text-align: center; font-size: 14px; }
    th { background-color: var(--primary-purple); color: white; }
    
    /* 密碼畫面 */
    #authOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--primary-purple); z-index: 1000; display: flex; align-items: center; justify-content: center; color: white; }
  </style>
</head>
<body>

<!-- 密碼登入區 -->
<div id="authOverlay">
  <div style="text-align:center;">
    <h2>香港健康文化協會</h2>
    <input type="password" id="passwordInput" placeholder="請輸入密碼" style="color:black; width: 200px;">
    <button onclick="checkPassword()" style="background:white; color:var(--primary-purple); width: 200px;">登入</button>
  </div>
</div>

<div class="container">
  <div class="header"><h1>香港健康文化協會<br>考核表格</h1></div>

  <div class="card">
    <h2>進行考核</h2>
    <label>選擇學員：</label>
    <select id="studentSelect" onchange="loadStudentData()"><option value="">-- 請選擇學員 --</option></select>
    <label>學號：</label><input type="text" id="examId" readonly>
    <label>現時級別：</label><input type="text" id="examRank" readonly>
    
    <label>考核是否合格：</label>
    <select id="examPassed">
      <option value="fail">否 (保持原級別)</option>
      <option value="pass_same">是 (通過，保持原級別)</option>
      <option value="pass_up">是 (通過，晉升下一級)</option>
    </select>
    
    <button onclick="saveExamResult()" style="background-color: var(--primary-purple);">儲存考核紀錄</button>
  </div>

  <div class="card">
    <h2>學員管理與名冊</h2>
    <input type="text" id="newStudentId" placeholder="學號">
    <input type="text" id="newStudentName" placeholder="姓名">
    <button onclick="addStudent()">新增學員 (預設: 一級)</button>
    <button class="btn-export" onclick="exportReport()">匯出並下載考核報告</button>
    <table>
      <thead><tr><th>學號</th><th>姓名</th><th>級別</th><th>操作</th></tr></thead>
      <tbody id="studentTableBody"></tbody>
    </table>
  </div>
</div>

<script>
  // 密碼檢查邏輯
  function checkPassword() {
    if(document.getElementById('passwordInput').value === 'exam') {
      sessionStorage.setItem('isLoggedIn', 'true');
      document.getElementById('authOverlay').style.display = 'none';
    } else {
      alert('密碼錯誤！');
    }
  }
  if(sessionStorage.getItem('isLoggedIn') === 'true') document.getElementById('authOverlay').style.display = 'none';

  const RANKS = ["十級", "九級", "八級", "七級", "六級", "伍級", "四級", "三級", "二級", "一級", "黑帶"];
  
  let students = JSON.parse(localStorage.getItem('hk_health_students')) || [
    { id: "6", name: "盧明俐", rank: "黑帶" }, { id: "15", name: "林雪蓮", rank: "黑帶" },
    { id: "20", name: "譚美霞", rank: "黑帶" }, { id: "17", name: "李翹伶", rank: "黑帶" },
    { id: "9", name: "陸婥然", rank: "黑帶" }, { id: "16", name: "何肇東", rank: "黑帶" },
    { id: "8", name: "陳麗君", rank: "黑帶" }, { id: "23", name: "陸景城", rank: "八級" },
    { id: "24", name: "黎世瓊", rank: "八級" }, { id: "26", name: "楊燕娜", rank: "八級" },
    { id: "25", name: "區美珍", rank: "八級" }, { id: "32", name: "黄愛晴", rank: "六級" },
    { id: "44", name: "方兆賢", rank: "六級" }, { id: "29", name: "梁美玲", rank: "六級" },
    { id: "31", name: "蔡麗珠", rank: "六級" }, { id: "38", name: "關凱惠", rank: "六級" },
    { id: "37", name: "鄺炳權", rank: "伍級" }, { id: "35", name: "李文英", rank: "伍級" },
    { id: "36", name: "鍾炳權", rank: "伍級" }, { id: "39", name: "蘇少賢", rank: "伍級" },
    { id: "45", name: "張家莉", rank: "四級" }, { id: "46", name: "周响輝", rank: "四級" },
    { id: "42", name: "鍾麗君", rank: "四級" }, { id: "40", name: "歐志雄", rank: "四級" },
    { id: "39", name: "蘇少敏", rank: "二級" }, { id: "47", name: "朱秉江", rank: "一級" },
    { id: "48", name: "廖金虹", rank: "一級" }
  ];

  function saveAndRender() { localStorage.setItem('hk_health_students', JSON.stringify(students)); renderStudents(); }

  function renderStudents() {
    const tbody = document.getElementById('studentTableBody');
    const select = document.getElementById('studentSelect');
    tbody.innerHTML = '';
    select.innerHTML = '<option value="">-- 請選擇學員 --</option>';
    students.forEach((s, index) => {
      tbody.innerHTML += `<tr><td>${s.id}</td><td>${s.name}</td><td>${s.rank}</td><td><button style="background:red; padding:5px; width:40px;" onclick="deleteStudent(${index})">X</button></td></tr>`;
      select.innerHTML += `<option value="${index}">${s.id} - ${s.name}</option>`;
    });
  }

  function addStudent() {
    const name = document.getElementById('newStudentName').value;
    if(!name) return alert('請填寫姓名');
    students.push({ id: document.getElementById('newStudentId').value || "-", name: name, rank: "一級" });
    saveAndRender();
    alert('已新增學員：' + name);
  }

  function deleteStudent(index) { if(confirm('確定刪除？')) { students.splice(index, 1); saveAndRender(); } }

  function loadStudentData() {
    const idx = document.getElementById('studentSelect').value;
    if (idx !== "") { document.getElementById('examId').value = students[idx].id; document.getElementById('examRank').value = students[idx].rank; }
  }

  function saveExamResult() {
    const idx = document.getElementById('studentSelect').value;
    const action = document.getElementById('examPassed').value;
    if (idx === "") return alert('請選擇學員');
    
    if (action === 'pass_up') {
      let rIdx = RANKS.indexOf(students[idx].rank);
      if (rIdx < RANKS.length - 1) students[idx].rank = RANKS[rIdx + 1];
      alert('考核合格！已晉升至：' + students[idx].rank);
    } else if (action === 'pass_same') {
      alert('考核合格！紀錄已更新。');
    } else {
      alert('考核未通過，已紀錄。');
    }
    saveAndRender();
  }

  function exportReport() {
    // 1. CSV 下載
    let csvContent = "\uFEFF學號,姓名,級別\n";
    students.forEach(s => csvContent += `${s.id},${s.name},${s.rank}\n`);
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "考核報告.csv";
    link.click();
    
    // 2. 開啟新視窗列印
    let win = window.open("", "_blank");
    win.document.write("<html><head><title>考核報告</title><style>table{width:100%; border-collapse:collapse;} th,td{border:1px solid #ccc; padding:8px; text-align:center;}</style></head><body>");
    win.document.write("<h1>香港健康文化協會 - 考核報告</h1><table border='1'><tr><th>學號</th><th>姓名</th><th>級別</th></tr>");
    students.forEach(s => win.document.write(`<tr><td>${s.id}</td><td>${s.name}</td><td>${s.rank}</td></tr>`));
    win.document.write("</table><br><button onclick='window.print()'>列印報告</button></body></html>");
  }
  renderStudents();
</script>
</body>
</html>
