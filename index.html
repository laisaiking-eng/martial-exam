<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港健康文化協會 - 考核系統</title>
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIuimmemAheaDheaxieS9k+iCsiAtIOiDveagoOezu3XpIiwKICAic2hvcnRfbmFtZSI6ICLllqRleGFtIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiM0QTE2OEIiLAogICJ0aGVtZV9jb2xvciI6ICIjNEExNjhCIgp9">
  <style>
    :root {
      --primary-purple: #4A168B;
      --light-purple: #7B2CBF;
      --accent-purple: #9D4EDD;
      --bg-purple: #F3E8FF;
      --card-bg: #FFFFFF;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-purple);
      color: #333;
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .header {
      background: linear-gradient(135deg, var(--primary-purple), var(--light-purple));
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      margin-bottom: 20px;
    }
    .header h1 { margin: 0; font-size: 22px; }
    .header p { margin: 5px 0 0 0; font-size: 14px; opacity: 0.9; }
    
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    h2 { font-size: 18px; color: var(--primary-purple); border-bottom: 2px solid var(--accent-purple); padding-bottom: 6px; margin-top: 0; }
    
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 14px; }
    input[type="text"], input[type="number"], select {
      width: 100%; padding: 8px 10px; border: 1px solid #CCC; border-radius: 6px; box-sizing: border-box; font-size: 14px;
    }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    
    button {
      background-color: var(--light-purple);
      color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; width: 100%; transition: 0.2s;
    }
    button:hover { background-color: var(--primary-purple); }
    button.danger { background-color: #D90429; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #DDD; padding: 8px; text-align: center; font-size: 14px; }
    th { background-color: var(--primary-purple); color: white; }
    
    .modal {
      display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-content { background: white; padding: 25px; border-radius: 12px; width: 300px; text-align: center; }
    
    .badge { background: var(--accent-purple); color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
  </style>
</head>
<body>

<div id="loginModal" class="modal">
  <div class="modal-content">
    <h3 style="color: var(--primary-purple);">香港健康文化協會</h3>
    <p>請輸入考卷系統密碼：</p>
    <input type="password" id="passwordInput" placeholder="密碼 (exam)" style="margin-bottom: 15px;">
    <button onclick="checkPassword()">登入系統</button>
  </div>
</div>

<div class="container" id="mainApp" style="display:none;">
  <div class="header">
    <h1>香港健康文化協會 - 考核表格</h1>
    <p>日期：<span id="currentDate"></span></p>
  </div>

  <!-- 學員管理 -->
  <div class="card">
    <h2>學員管理</h2>
    <div class="grid-3">
      <input type="text" id="newStudentId" placeholder="學號 (例如: 5)">
      <input type="text" id="newStudentName" placeholder="姓名">
      <select id="newStudentRank">
        <option value="10級">10級</option>
        <option value="九級">九級</option>
        <option value="八級">八級</option>
        <option value="七級">七級</option>
        <option value="六級">六級</option>
        <option value="伍級">伍級</option>
        <option value="四級">四級</option>
        <option value="三級">三級</option>
        <option value="二級">二級</option>
        <option value="一級">一級</option>
        <option value="黑帶">黑帶</option>
      </select>
    </div>
    <button onclick="addStudent()" style="margin-top: 10px;">新增學員</button>
  </div>

  <!-- 選擇學員進行考核 -->
  <div class="card">
    <h2>進行考核</h2>
    <div class="form-group">
      <label>選擇學員：</label>
      <select id="studentSelect" onchange="loadStudentData()">
        <option value="">-- 請選擇學員 --</option>
      </select>
    </div>

    <form id="examForm">
      <div class="grid-2">
        <div class="form-group"><label>學號：</label><input type="text" id="examId" readonly></div>
        <div class="form-group"><label>現時級別：</label><input type="text" id="examRank" readonly></div>
      </div>

      <!-- 功法內容 -->
      <h3>一、功法考核</h3>
      <div class="grid-2">
        <div class="form-group"><label>前俯腰 (吋)：</label><input type="text"></div>
        <div class="form-group"><label>指 / 拳 / 掌：</label><input type="text"></div>
        <div class="form-group"><label>定式 (分/秒)：</label><input type="text"></div>
        <div class="form-group"><label>膝 / 腰 / 臂膊：</label><input type="text"></div>
        <div class="form-group"><label>外擺腿：</label><input type="text"></div>
        <div class="form-group"><label>腿法 (彈腿/蹬腿/側踢)：</label><input type="text"></div>
      </div>

      <!-- 拳腳內容 -->
      <h3>二、拳腳考核</h3>
      <div class="grid-2">
        <div class="form-group"><label>雙拳三步：</label><input type="text"></div>
        <div class="form-group"><label>七式 (活步/A前進攻/B後退防)：</label><input type="text"></div>
        <div class="form-group"><label>原地十式：</label><input type="text"></div>
        <div class="form-group"><label>活步十式：</label><input type="text"></div>
      </div>

      <!-- 其他評語與合格判定 -->
      <h3>三、考核結果與評語</h3>
      <div class="form-group">
        <label>本級評語/其他：</label>
        <input type="text" id="examNotes">
      </div>
      <div class="form-group">
        <label>考驗是否合格：</label>
        <select id="examPassed">
          <option value="否">否 (保持原級別)</option>
          <option value="是">是 (自動升級)</option>
        </select>
      </div>

      <button type="button" onclick="saveExamResult()" style="margin-top: 10px; background-color: var(--primary-purple);">儲存考核紀錄並升級</button>
    </form>
  </div>

  <!-- 學員名冊 -->
  <div class="card">
    <h2>學員名冊</h2>
    <table>
      <thead>
        <tr>
          <th>學號</th>
          <th>姓名</th>
          <th>級別</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="studentTableBody"></tbody>
    </table>
  </div>
</div>

<script>
  const RANKS = ["10級", "九級", "八級", "七級", "六級", "伍級", "四級", "三級", "二級", "一級", "黑帶"];

  let students = [
    { id: "6", name: "盧明俐", rank: "黑帶" },
    { id: "15", name: "林雪蓮", rank: "黑帶" },
    { id: "5", name: "張勵常", rank: "10級" },
    { id: "23", name: "陸景城", rank: "九級" },
    { id: "32", name: "黄愛晴", rank: "六級" },
    { id: "37", name: "鄺炳權", rank: "伍級" },
    { id: "45", name: "張家莉", rank: "四級" },
    { id: "39", name: "蘇少敏", rank: "二級" },
    { id: "30", name: "朱秉江", rank: "一級" }
  ];

  function checkPassword() {
    const pwd = document.getElementById('passwordInput').value;
    if (pwd === 'exam') {
      document.getElementById('loginModal').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
      initApp();
    } else {
      alert('密碼錯誤！');
    }
  }

  function initApp() {
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString('zh-HK');
    renderStudents();
  }

  function renderStudents() {
    const tbody = document.getElementById('studentTableBody');
    const select = document.getElementById('studentSelect');
    tbody.innerHTML = '';
    select.innerHTML = '<option value="">-- 請選擇學員 --</option>';

    students.forEach((s, index) => {
      // 填入表格
      tbody.innerHTML += `
        <tr>
          <td>${s.id}</td>
          <td>${s.name}</td>
          <td><span class="badge">${s.rank}</span></td>
          <td><button class="danger" style="padding: 4px 8px; font-size:12px;" onclick="deleteStudent(${index})">刪除</button></td>
        </tr>
      `;
      // 填入選單
      select.innerHTML += `<option value="${index}">${s.id} - ${s.name} (${s.rank})</option>`;
    });
  }

  function addStudent() {
    const id = document.getElementById('newStudentId').value.trim();
    const name = document.getElementById('newStudentName').value.trim();
    const rank = document.getElementById('newStudentRank').value;

    if (!id || !name) {
      alert('請填寫學號與姓名');
      return;
    }

    students.push({ id, name, rank });
    document.getElementById('newStudentId').value = '';
    document.getElementById('newStudentName').value = '';
    renderStudents();
    alert('學員新增成功！');
  }

  function deleteStudent(index) {
    if (confirm('確定要刪除該學員嗎？')) {
      students.splice(index, 1);
      renderStudents();
    }
  }

  function loadStudentData() {
    const idx = document.getElementById('studentSelect').value;
    if (idx === "") return;
    const s = students[idx];
    document.getElementById('examId').value = s.id;
    document.getElementById('examRank').value = s.rank;
  }

  function saveExamResult() {
    const idx = document.getElementById('studentSelect').value;
    if (idx === "") {
      alert('請先選擇學員！');
      return;
    }

    const isPassed = document.getElementById('examPassed').value === '是';
    if (isPassed) {
      let currentRank = students[idx].rank;
      let rankIndex = RANKS.indexOf(currentRank);
      if (rankIndex !== -1 && rankIndex < RANKS.length - 1) {
        students[idx].rank = RANKS[rankIndex + 1];
        alert(`考驗合格！學員已自動升級至：${students[idx].rank}`);
      } else {
        alert('考驗合格！該學員已是黑帶，維持黑帶級別。');
      }
    } else {
      alert('考驗結果已儲存（未升級）。');
    }

    document.getElementById('examForm').reset();
    renderStudents();
  }
</script>
</body>
</html>
